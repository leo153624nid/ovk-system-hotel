# Инфраструктура и сервисы приложения. Новые сервисы добавляются по мере готовности.
name: ovk-hotel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-migrate:
    build:
      context: ../backend
      args:
        SERVICE: auth
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@postgres:5432/auth_db?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ../backend
      args:
        SERVICE: auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@postgres:5432/auth_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ovk-auth}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  hotel-migrate:
    build:
      context: ../backend
      args:
        SERVICE: hotel
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://hotel:${HOTEL_DB_PASSWORD}@postgres:5432/hotel_db?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  hotel:
    build:
      context: ../backend
      args:
        SERVICE: hotel
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hotel:${HOTEL_DB_PASSWORD}@postgres:5432/hotel_db?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ovk-auth}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      hotel-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ../backend
      args:
        SERVICE: gateway
    restart: unless-stopped
    environment:
      AUTH_URL: http://auth:8081
      HOTEL_URL: http://hotel:8082
      AUDIT_URL: http://audit:8083
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ovk-auth}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-10}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Единственная точка входа в API; сервисы наружу не публикуются.
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      hotel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  natsdata:
